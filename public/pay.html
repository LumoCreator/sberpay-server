<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sber Smile Terminal</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

*{box-sizing:border-box;font-family:Inter;margin:0;padding:0;}
body{
height:100vh;
background:
radial-gradient(60% 60% at 20% 10%, #21c06333, transparent),
radial-gradient(50% 50% at 80% 90%, #1bd96a22, transparent),
linear-gradient(135deg,#0b1f24,#16343f,#1e4b5f);
display:flex;align-items:center;justify-content:center;color:#fff;overflow:hidden;
}

.app{
width:min(420px,95vw);
height:min(760px,95vh);
border-radius:36px;
background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,.05));
backdrop-filter:blur(28px);
box-shadow:0 30px 80px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.2);
position:relative;
overflow:hidden;
display:flex;flex-direction:column;align-items:center;justify-content:center;
}

/* SCREENS */
.screen{
position:absolute;inset:0;
padding:28px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
opacity:0;
pointer-events:none;
transform:scale(1.06);
transition:.5s cubic-bezier(.4,0,.2,1);
}
.screen.active{
opacity:1;
pointer-events:auto;
transform:scale(1);
}

/* MAIN */
.logo{font-size:30px;font-weight:700;letter-spacing:.5px;margin-bottom:12px;}
.tap{opacity:.7;animation:pulse 2s infinite;}
@keyframes pulse{50%{opacity:1}}

/* INPUT */
input{width:100%;padding:20px;font-size:26px;border-radius:22px;border:none;background:rgba(255,255,255,.22);color:#fff;text-align:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);}

/* BUTTON */
.btn{width:100%;padding:20px;margin-top:16px;border-radius:22px;border:none;font-weight:700;font-size:16px;cursor:pointer;color:#fff;background:linear-gradient(135deg,#21c063,#1bd96a);box-shadow:0 0 35px #21c063aa;transition:.25s;}
.btn.alt{background:rgba(255,255,255,.18);box-shadow:none;}
.btn:active{transform:scale(.96)}

/* CAMERA */
.cameraWrap{position:relative;width:260px;height:260px;display:flex;align-items:center;justify-content:center;}
video{
width:220px;
height:220px;
border-radius:50%;
object-fit:cover;
border:4px solid rgba(255,255,255,.35);
z-index:2;
transform:scaleX(-1); /* зеркалирование камеры */
}
.wave{position:absolute;inset:0;border-radius:50%;border:2px solid #21c063;animation:wave 1.6s infinite;}
.wave:nth-child(2){animation-delay:.5s}
.wave:nth-child(3){animation-delay:1s}
@keyframes wave{from{transform:scale(.8);opacity:.8}to{transform:scale(1.3);opacity:0}}

/* PROGRESS RING */
#progressRing{position:absolute;top:-10px;left:-10px;width:280px;height:280px;z-index:3;stroke:#21c063;stroke-width:4;fill:none;stroke-dasharray:880;stroke-dashoffset:880;transition:stroke-dashoffset .1s linear;}

/* SUCCESS */
.checkmark{width:130px;height:130px;stroke:#21c063;stroke-width:4;fill:none;filter:drop-shadow(0 0 20px #21c063aa);}
.checkmark circle{stroke-dasharray:157;stroke-dashoffset:157;animation:drawCircle .6s forwards;}
.checkmark path{stroke-dasharray:48;stroke-dashoffset:48;animation:drawCheck .4s forwards .6s;}
@keyframes drawCircle{to{stroke-dashoffset:0}}
@keyframes drawCheck{to{stroke-dashoffset:0}}
#doneText{margin-top:18px;font-size:20px;opacity:0;animation:textIn .6s forwards 1.1s;}
@keyframes textIn{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}

/* RECEIPT */
.receipt{width:90%;background:#fff;color:#000;border-radius:18px;padding:16px;margin-top:20px;overflow:hidden;height:auto;opacity:0;transform:scale(0.85);transition:all 0.8s cubic-bezier(.4,0,.2,1);font-family:monospace;}
.receipt.show{opacity:1;transform:scale(1);}
.receipt h4{text-align:center;margin:6px 0;}
.line{display:flex;justify-content:space-between;font-size:14px;margin:6px 0;}

/* CONFETTI */
.confetti-piece{position:absolute;width:8px;height:8px;border-radius:50%;background:radial-gradient(circle,#21c063,#1bd96a);}

/* LOADING */
.loader{width:160px;height:160px;border-radius:50%;border:4px solid rgba(255,255,255,.15);border-top:4px solid #21c063;animation:spin 1s linear infinite;display:flex;align-items:center;justify-content:center;box-shadow:0 0 50px #21c063aa;position:relative;}
@keyframes spin{to{transform:rotate(360deg)}}
.loaderText{position:absolute;width:140px;text-align:center;font-size:14px;}

/* ARROWS */
#arrows{position:absolute;bottom:80px;display:flex;gap:12px;}
.arrow{
width:36px;height:36px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:20px;opacity:0;transform:translate(0,0);
transition:all 0.5s cubic-bezier(.4,0,.2,1);
box-shadow:0 0 12px #fff5;
color:#fff;
}
.arrow.active{
opacity:1;
animation:moveArrow 0.8s ease-in-out infinite alternate;
}
.arrow.up{--x:0;--y:-20px;}
.arrow.down{--x:0;--y:20px;}
.arrow.left{--x:-20px;--y:0;}
.arrow.right{--x:20px;--y:0;}
@keyframes moveArrow{
0%{transform:translate(0,0)}
100%{transform:translate(var(--x),var(--y))}
}
</style>
</head>

<body>
<div class="app">

<!-- MAIN -->
<div class="screen active" id="main">
<div class="logo">💚 Sber Pay</div>
<div class="tap">Коснитесь экрана 5 раз</div>
</div>

<!-- AMOUNT INPUT -->
<div class="screen" id="amountScreen">
<h2>Введите сумму</h2>
<input id="amount" type="number" placeholder="₽">
<button class="btn" onclick="toChoice()">Продолжить</button>
</div>

<!-- PAYMENT CHOICE -->
<div class="screen" id="choice">
<h2>Способ оплаты</h2>
<p>Сумма: <strong id="displayAmount">0 ₽</strong></p>
<button class="btn" onclick="pay()">💳 Обычная оплата</button>
<button class="btn alt" onclick="smile()">😁 Оплата улыбкой</button>
</div>

<!-- LOADING -->
<div class="screen" id="loading">
<div class="loader"></div>
<div class="loaderText" id="loaderText">Отправляю запрос…</div>
</div>

<!-- CAMERA -->
<div class="screen" id="camera">
<h2>Улыбнитесь 😁</h2>
<div class="cameraWrap">
<svg id="progressRing" viewBox="0 0 280 280">
<circle cx="140" cy="140" r="140"/>
</svg>
<div class="wave"></div>
<div class="wave"></div>
<div class="wave"></div>
<video id="video" autoplay muted playsinline></video>
</div>

<div id="arrows">
<div class="arrow up" id="arrowUp">↑</div>
<div class="arrow down" id="arrowDown">↓</div>
<div class="arrow left" id="arrowLeft">←</div>
<div class="arrow right" id="arrowRight">→</div>
</div>
</div>

<!-- SUCCESS -->
<div class="screen" id="success">
<svg class="checkmark" viewBox="0 0 52 52">
<circle cx="26" cy="26" r="25"/>
<path d="M14 27l7 7 17-17"/>
</svg>
<div id="doneText"></div>
<div class="receipt" id="receipt">
<h4>Чек</h4>
<div class="line"><span>Сумма</span><span id="rAmount"></span></div>
<div class="line"><span>Статус</span><span>Успешно</span></div>
<div class="line"><span>Метод</span><span id="rMethod"></span></div>
</div>
</div>

</div>

<script>
const screens={main,amountScreen,choice,loading,camera,success};
let taps=0;
let cam=null, mesh=null;
let smileCount=0;
const video=document.getElementById('video');
const progressRing=document.getElementById('progressRing').querySelector('circle');
const receipt=document.getElementById('receipt');
const displayAmount=document.getElementById('displayAmount');
const rAmount=document.getElementById('rAmount');
const rMethod=document.getElementById('rMethod');
const loaderText=document.getElementById('loaderText');
const arrows={
up:document.getElementById('arrowUp'),
down:document.getElementById('arrowDown'),
left:document.getElementById('arrowLeft'),
right:document.getElementById('arrowRight')
};

main.onclick=()=>{if(++taps===5){taps=0;show('amountScreen')}};
function show(n){
Object.values(screens).forEach(s=>s.classList.remove('active'));
screens[n].classList.add('active');
receipt.classList.remove('show');
Object.values(arrows).forEach(a=>a.classList.remove('active'));
}

// Переход к выбору оплаты
function toChoice(){
  if(amount.value){
    displayAmount.innerText=amount.value+' ₽';
    show('choice');
  }
}

// Обычная оплата
function pay(){
show('loading');
loaderText.innerText='Отправляю запрос…';
setTimeout(()=>loaderText.innerText='Жду ответа…',800);
setTimeout(()=>loaderText.innerText='Ответ получен',1600);
setTimeout(()=>done('Карта'),2200);
}

// Инициализация Face Mesh
function initFace(){
mesh=new FaceMesh({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}`});
mesh.onResults(results=>{
if(!results.multiFaceLandmarks)return;
const m=results.multiFaceLandmarks[0];
// Центр лица (корректируем зеркалирование)
let centerX=1-( (m[168].x+m[5].x)/2 ); // зеркальное X
const centerY=(m[168].y+m[5].y)/2;
const offsetX=centerX-0.5;
const offsetY=centerY-0.5;

// Сброс стрелок
Object.values(arrows).forEach(a=>a.classList.remove('active'));

// Показываем стрелки при смещении
if(offsetX<-0.08) arrows.right.classList.add('active');
if(offsetX>0.08) arrows.left.classList.add('active');
if(offsetY<-0.08) arrows.down.classList.add('active');
if(offsetY>0.08) arrows.up.classList.add('active');

// Проверка улыбки
const w=Math.abs(m[308].x-m[78].x);
const h=Math.abs(m[13].y-m[14].y);
const ratio=w/h;
if(ratio>0.32 && Math.abs(offsetX)<0.08 && Math.abs(offsetY)<0.08){
smileCount=Math.min(smileCount+1,10);
}else{smileCount=Math.max(smileCount-1,0);}
progressRing.style.strokeDashoffset=880*(1-smileCount/10);
if(smileCount>=10){done('Улыбка');}
});
}

// Оплата улыбкой
function smile(){
show('camera');
smileCount=0;
progressRing.style.strokeDashoffset=880;
if(!mesh) initFace();
if(cam){cam.stop();cam=null;}
cam=new Camera(video,{onFrame:async()=>mesh.send({image:video}),width:220,height:220});
cam.start();
}

// Завершение оплаты
function done(method='Карта'){
if(cam){cam.stop();cam=null;}
show('success');
doneText.innerText=`Оплачено: ${amount.value} ₽`;
rAmount.innerText=''; rMethod.innerText='';

// Плавное появление чека
setTimeout(()=>{rAmount.innerText=amount.value+' ₽'; rMethod.innerText=method; receipt.classList.add('show');},400);

// Финальный конфетти
launchConfetti();
setTimeout(()=>show('main'),5000);
}

// Финальный конфетти
function launchConfetti(){
for(let i=0;i<40;i++){
let c=document.createElement('div');
c.className='confetti-piece';
c.style.left=Math.random()*360+'px';
c.style.top=Math.random()*-30+'px';
c.style.width=(4+Math.random()*6)+'px';
c.style.height=(4+Math.random()*6)+'px';
c.style.background=`hsl(${Math.random()*120+100},80%,50%)`;
c.style.opacity=Math.random()*0.9+0.3;
document.querySelector('.app').appendChild(c);
let angle=Math.random()*2*Math.PI;
let speed=50+Math.random()*100;
c.animate([{transform:`translate(0,0)`},{transform:`translate(${Math.cos(angle)*speed}px,${Math.sin(angle)*speed + 200}px)`}],{duration:2000, easing:'ease-out'});
setTimeout(()=>c.remove(),2200);
}
}
</script>
</body>
</html>
